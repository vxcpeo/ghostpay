<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Veilary — private payments, invisible by design. The private payment rail for Solana.">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#070d13"/>
      <stop offset="0.55" stop-color="#04070b"/>
      <stop offset="1" stop-color="#030508"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.86" cy="0.02" r="0.62">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#ff3b30" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMagenta" cx="0.02" cy="1" r="0.5">
      <stop offset="0" stop-color="#ff5cd6" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ff5cd6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#4df0d0" stroke-opacity="0.045"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" fill-opacity="0.018"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#scan)"/>
  <rect width="1200" height="630" fill="url(#glowRed)"/>
  <rect width="1200" height="630" fill="url(#glowMagenta)"/>

  <!-- status bar -->
  <rect width="1200" height="56" fill="#04070b" fill-opacity="0.94"/>
  <rect x="0" y="0" width="1200" height="2" fill="#ff3b30"/>
  <rect x="0" y="55" width="1200" height="1" fill="#1a2a36"/>
  <g transform="translate(40,11)">
    <rect width="34" height="34" rx="4" fill="#ff3b30"/>
    <path d="M7.5 9 17 26.5 26.5 9" fill="none" stroke="#070b10" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="27.5" cy="6.5" r="2" fill="#ff9b91"/>
  </g>
  <text x="86" y="35" fill="#eef6fb" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="19" font-weight="700" letter-spacing="4">VEILARY</text>
  <g fill="#9db3c4" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="10" letter-spacing="1.6">
    <text x="224" y="34">HOME</text>
    <text x="286" y="34">FEATURES</text>
    <text x="392" y="34">HOW IT WORKS</text>
    <text x="528" y="34">TOKENOMICS</text>
    <text x="652" y="34">ROADMAP</text>
    <text x="744" y="34">FAQ</text>
  </g>
  <rect x="1018" y="0" width="182" height="56" fill="#ff3b30"/>
  <text x="1109" y="34" fill="#070b10" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="2">LAUNCH APP</text>

  <!-- headline -->
  <text x="64" y="178" fill="#eef6fb" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="58" font-weight="700" letter-spacing="-2">Private payments,</text>
  <text x="64" y="246" fill="#ff3b30" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="58" font-weight="700" letter-spacing="-2">invisible by design.</text>

  <text x="64" y="306" fill="#a3b8c8" font-family="'Segoe UI', Arial, sans-serif" font-size="21">The private payment rail for Solana.</text>
  <text x="64" y="338" fill="#7b93a4" font-family="'Segoe UI', Arial, sans-serif" font-size="15">Stealth addresses · HPKE-sealed instructions · non-custodial settlement.</text>
  <text x="64" y="362" fill="#7b93a4" font-family="'Segoe UI', Arial, sans-serif" font-size="15">Powered by $GHOST.</text>

  <g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="10" letter-spacing="1.6">
    <rect x="64" y="410" width="126" height="26" fill="none" stroke="#2a4355"/>
    <circle cx="79" cy="423" r="3" fill="#ff3b30"/>
    <text x="91" y="427" fill="#a3b8c8">SOLANA</text>
    <text x="212" y="427" fill="#7b93a4">MAINNET · LIVE PRIVATE PAYMENTS</text>
  </g>

  <!-- transaction console -->
  <g>
    <rect x="688" y="112" width="448" height="386" rx="6" fill="#0a121a" stroke="#2a4355"/>
    <rect x="688" y="112" width="448" height="46" rx="6" fill="#ff3b30" fill-opacity="0.07"/>
    <rect x="688" y="157" width="448" height="1" fill="#2a4355"/>
    <text x="706" y="141" fill="#eef6fb" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" font-weight="700">veilary://send</text>
    <text x="1118" y="141" fill="#ff9b91" text-anchor="end" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="9" letter-spacing="1.8">PRIVATE</text>

    <g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="10" letter-spacing="1.4">
      <text x="706" y="185" fill="#7b93a4">FROM</text>
      <text x="1118" y="185" fill="#eef6fb" text-anchor="end" font-size="11">0x7f…a91c · Veilary balance</text>
      <text x="706" y="217" fill="#7b93a4">TO</text>
      <text x="1118" y="217" fill="#ff9b91" text-anchor="end" font-size="11">stealth ●●9d4f</text>
      <text x="706" y="249" fill="#7b93a4">AMOUNT</text>
      <text x="1118" y="249" fill="#ff9b91" text-anchor="end" font-size="11" letter-spacing="4">▮▮▮▮▮▮ · hidden</text>
    </g>
    <line x1="706" y1="199" x2="1118" y2="199" stroke="#1a2a36" stroke-dasharray="3 4"/>
    <line x1="706" y1="231" x2="1118" y2="231" stroke="#1a2a36" stroke-dasharray="3 4"/>

    <rect x="706" y="266" width="412" height="74" rx="4" fill="#ff5cd6" fill-opacity="0.055" stroke="#ff5cd6" stroke-opacity="0.28"/>
    <text x="722" y="288" fill="#ff5cd6" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="9" letter-spacing="1.8">HPKE SEAL</text>
    <text x="1102" y="288" fill="#5ce1a0" text-anchor="end" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="9" letter-spacing="1.8">SEALED ✓</text>
    <text x="722" y="315" fill="#7b93a4" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="10">0x8ac4 f19b 22de 77a0 4c31 9fbe 08d2 5c66</text>

    <rect x="706" y="356" width="412" height="46" rx="3" fill="#ff3b30"/>
    <text x="912" y="385" fill="#070b10" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="2">SEND PRIVATELY</text>

    <g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="9" letter-spacing="1.2">
      <rect x="706" y="420" width="196" height="26" fill="none" stroke="#1a2a36"/>
      <text x="716" y="437" fill="#ff9b91">CA</text>
      <text x="742" y="437" fill="#a3b8c8">BBKPiLM9…BGHST</text>
      <text x="1118" y="437" fill="#7b93a4" text-anchor="end">COPY</text>
    </g>
    <g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="9" letter-spacing="1.2">
      <text x="706" y="474" fill="#7b93a4">SETTLEMENT</text>
      <text x="806" y="474" fill="#5ce1a0">&lt;1s</text>
      <text x="882" y="474" fill="#7b93a4">FINALITY</text>
      <text x="962" y="474" fill="#eef6fb">0.4s</text>
    </g>
  </g>

  <!-- footer -->
  <line x1="64" y1="556" x2="1136" y2="556" stroke="#1a2a36"/>
  <text x="64" y="590" fill="#ff3b30" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="2">$GHOST</text>
  <text x="152" y="590" fill="#a3b8c8" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="12" letter-spacing="1">veilary.xyz</text>
  <text x="1136" y="590" fill="#7b93a4" text-anchor="end" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="9" letter-spacing="1.5">NON-CUSTODIAL · NO KYC</text>
</svg>
